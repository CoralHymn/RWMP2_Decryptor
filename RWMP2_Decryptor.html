<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>RWMP2 解密修复器（原版逻辑 · 浏览器移植）</title>
  <style>
    body { font-family: Consolas, monospace; max-width: 900px; margin: 30px auto; padding: 20px; background: #f5f5f5; }
    h1 { color: #d32f2f; }
    button { padding: 10px 20px; font-size: 16px; background: #1976d2; color: white; border: none; cursor: pointer; }
    input[type="file"] { margin: 10px 0; }
    #status { background: white; padding: 15px; border-radius: 6px; height: 300px; overflow-y: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>🎮 RWMP2 解密修复器（严格保留原版逻辑）</h1>
  <p>支持 .rwmod 或 .zip 文件。全程在浏览器内存中运行。</p>
  
  <input type="file" id="inputFile" accept=".zip,.rwmod" />
  <br /><br />
  <button onclick="startRepair()">开始修复并下载 _最终修复.zip</button>
  
  <div id="status">等待文件...</div>

  <script type="text/javascript">
    let pyodideReady = false;

    async function initPyodide() {
      const statusDiv = document.getElementById("status");
      statusDiv.innerText = "正在加载 Pyodide（首次约需 10–20 秒）...\n";
      
      try {
        // ✅ 正确加载方式（v0.26.2）
        const { loadPyodide } = await import("https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.mjs");
        const pyodide = await loadPyodide({
          indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/"
        });
        window.pyodide = pyodide;
        
        // ⚠️ 不要 loadPackage("zlib")！它是内置的
        pyodide.runPython(pythonCode);
        pyodideReady = true;
        statusDiv.innerText += "\n✅ Pyodide 初始化成功！请上传文件。\n";
      } catch (e) {
        console.error("Pyodide 初始化失败:", e);
        statusDiv.innerText += `\n❌ 初始化失败：${e.message || e}\n`;
      }
    }

    async function startRepair() {
      if (!pyodideReady) {
        alert("Pyodide 尚未加载完成，请稍候...");
        return;
      }

      const fileInput = document.getElementById("inputFile");
      const statusDiv = document.getElementById("status");
      if (!fileInput.files[0]) {
        alert("请先选择一个 .rwmod 或 .zip 文件");
        return;
      }

      const file = fileInput.files[0];
      const arrayBuffer = await file.arrayBuffer();
      const bytes = new Uint8Array(arrayBuffer);

      const originalName = file.name;
      const isRwmod = originalName.toLowerCase().endsWith('.rwmod');
      const zipName = isRwmod ? originalName.slice(0, -6) + '.zip' : originalName;
      window.pyodide.FS.writeFile(zipName, bytes, { encoding: "binary" });

      try {
        statusDiv.innerText += `\n📥 正在处理文件: ${zipName}\n`;
        const resultBytes = window.pyodide.globals.get("repair_rwmod_in_memory")(zipName);
        
        if (resultBytes === null) {
          throw new Error("修复返回空结果");
        }

        const outputName = zipName.replace(/\.zip$/i, "_最终修复.zip");
        downloadBlob(new Blob([resultBytes], { type: "application/zip" }), outputName);
        statusDiv.innerText += `\n🎉 修复完成！已下载：${outputName}\n`;
      } catch (e) {
        console.error(e);
        statusDiv.innerText += `\n💥 修复失败：${e.message || e}\n`;
      }
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 0);
    }

    // ==================== Python 代码（完全保留你的十六进制逻辑） ====================
    const pythonCode = `
import struct
import zlib
import zipfile
import io
from collections import defaultdict

def reverse_replace_in_zip_in_memory(data):
    replacements = {
        bytes.fromhex('2E 74 78 74 2F'): bytes.fromhex('2E 74 78 74 31'),
        bytes.fromhex('2E 69 6E 69 2F'): bytes.fromhex('2E 69 6E 69 31'),
        bytes.fromhex('2E 70 6E 67 2F'): bytes.fromhex('2E 70 6E 67 31')
    }
    modified = False
    for old, new in replacements.items():
        if old in 
            data = data.replace(old, new)
            modified = True
    return data if modified else None

class AdvancedZipRepairInMemory:
    def __init__(self, original_name, processed_data=None):
        self.original_name = original_name
        self.processed_data = processed_data

    def find_local_headers(self):
        headers = []
        data = self.processed_data if self.processed_data is not None else open(self.original_name, 'rb').read()
        offset = 0
        while offset < len(data) - 30:
            if data[offset:offset+4] == b'PK\\x03\\x04':
                header_info = self.parse_local_header(data, offset)
                if header_info:
                    headers.append(header_info)
                    compressed_size = header_info.get('compressed_size', 0)
                    if compressed_size > 0:
                        offset += 30 + len(header_info['filename']) + header_info.get('extra_length', 0) + compressed_size
                    else:
                        offset += 1
                else:
                    offset += 1
            else:
                offset += 1
        return headers

    def parse_local_header(self, data, offset):
        try:
            if offset + 30 > len(data):
                return None
            signature = struct.unpack('<I', data[offset:offset+4])[0]
            if signature != 0x04034b50:
                return None
            filename_length = struct.unpack('<H', data[offset+26:offset+28])[0]
            extra_length = struct.unpack('<H', data[offset+28:offset+30])[0]
            if filename_length > 1000 or offset + 30 + filename_length > len(data):
                return None
            filename_start = offset + 30
            filename_end = filename_start + filename_length
            try:
                filename = data[filename_start:filename_end].decode('utf-8')
            except:
                try:
                    filename = data[filename_start:filename_end].decode('gbk')
                except:
                    filename = data[filename_start:filename_end].decode('utf-8', errors='ignore')
            filename = self.clean_filename(filename)
            data_start = filename_end + extra_length
            compressed_size = struct.unpack('<I', data[offset+18:offset+22])[0]
            return {
                'offset': offset,
                'filename': filename,
                'compressed_size': compressed_size,
                'data_start': data_start,
                'data_end': data_start + compressed_size,
                'compression_method': struct.unpack('<H', data[offset+8:offset+10])[0],
                'extra_length': extra_length
            }
        except:
            return None

    def clean_filename(self, filename):
        illegal_chars = '<>: "|?*'
        for char in illegal_chars:
            filename = filename.replace(char, '_')
        return filename

    def extract_file_data(self, header_info):
        data = self.processed_data if self.processed_data is not None else open(self.original_name, 'rb').read()
        data_start = header_info['data_start']
        data_end = min(header_info['data_end'], len(data))
        compressed_data = data[data_start:data_end]
        method = header_info['compression_method']
        if method == 0:
            return compressed_data
        elif method == 8:
            try:
                return zlib.decompress(compressed_data, -zlib.MAX_WBITS)
            except:
                try:
                    decompressor = zlib.decompressobj(-zlib.MAX_WBITS)
                    return decompressor.decompress(compressed_data)
                except:
                    return compressed_data
        else:
            return compressed_data

    def batch_rename_files_in_memory(self, file_dict):
        extension_mapping = {
            '.ini1': '.ini', '.txt1': '.txt', '.png1': '.png', '.jpg1': '.jpg',
            '.jpeg1': '.jpeg', '.bmp1': '.bmp', '.gif1': '.gif', '.pdf1': '.pdf',
            '.doc1': '.doc', '.docx1': '.docx', '.xls1': '.xls', '.xlsx1': '.xlsx'
        }
        renamed = {}
        for name, data in file_dict.items():
            suffix = name.lower()
            for bad, good in extension_mapping.items():
                if suffix.endswith(bad):
                    new_name = name[:-len(bad)] + good
                    renamed[new_name] = data
                    break
            else:
                renamed[name] = data
        return renamed

    def repair_to_bytes(self):
        headers = self.find_local_headers()
        if not headers:
            return None
        extracted = {}
        for h in headers:
            data = self.extract_file_data(h)
            if data is not None and len(data) > 0:
                extracted[h['filename']] = data
        extracted = self.batch_rename_files_in_memory(extracted)
        output = io.BytesIO()
        with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as zf:
            for name, content in extracted.items():
                zf.writestr(name, content)
        return output.getvalue()

def repair_rwmod_in_memory(input_path):
    with open(input_path, 'rb') as f:
        raw_data = f.read()
    processed = reverse_replace_in_zip_in_memory(raw_data)
    if processed is None:
        processed = raw_data
    repairer = AdvancedZipRepairInMemory(input_path, processed)
    return repairer.repair_to_bytes()
`;

    initPyodide();
  </script>
</body>
</html>
